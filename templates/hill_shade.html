<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIFF Visualization with Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/panzoom/dist/panzoom.min.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #e8f0f2;
        }

        .sidebar {
            width: 300px;
            background-color: #ffffff;
            padding: 20px;
            border-right: 2px solid #00796b;
            box-shadow: 4px 0 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .sidebar h1 {
            color: #00796b;
            margin-bottom: 20px;
        }

        .sidebar form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .sidebar input[type="file"] {
            border: 2px solid #00796b;
            border-radius: 5px;
            padding: 10px;
            background-color: #e0f2f1;
            color: #00796b;
            width: 100%;
        }

        .sidebar select, .sidebar button {
            padding: 12px;
            border: 2px solid #00796b;
            border-radius: 5px;
            background-color: #ffffff;
            color: #00796b;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }

        .sidebar button {
            background-color: #00796b;
            color: white;
            font-weight: bold;
            border: none;
            transition: background-color 0.3s;
        }

        .sidebar button:hover {
            background-color: #004d40;
        }

        .content {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            display: block; /* Make sure map is displayed fully */
        }

        .map-container {
            display: none; /* Hide image container initially */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .map-container img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 2px solid #00796b;
            }

            .content {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h1>TIFF Visualization</h1>
    <form id="uploadForm">
        <input type="file" id="fileInput" accept=".tiff, .tif" required><br>

        <label for="band">Select Band:</label>
        <select id="band">
            <option value="1">Band 1</option>
            <option value="2">Band 2</option>
            <option value="3">Band 3</option>
        </select><br>

        <label for="colormap">Select Colormap:</label>
        <select id="colormap">
            <option value="gray">Gray</option>
            <option value="viridis">Viridis</option>
            <option value="inferno">Inferno</option>
            <option value="plasma">Plasma</option>
            <option value="hsv">HSV</option>
            <option value="bathymetry">Bathymetry</option>
        </select><br>

        <label for="hillshade">Apply Hillshade:</label>
        <input type="checkbox" id="hillshade"><br>

        <button type="submit">Upload and Process</button>
    </form>
    <div id="message" style="color: red; margin-top: 10px;"></div>
</div>

<div class="content">
    <div id="map"></div>
    <div class="map-container" id="visualization">
        <img id="outputImage" alt="Processed Image" />
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/panzoom/dist/panzoom.min.js"></script>
<script>
    var map = L.map('map').setView([0, 0], 2); // Initialize Leaflet map

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
    }).addTo(map);

    function showMap() {
        document.getElementById('map').style.display = 'block';
        document.getElementById('visualization').style.display = 'none';
    }

    function showVisualization(imageSrc) {
        document.getElementById('map').style.display = 'none';
        document.getElementById('visualization').style.display = 'block';

        const outputImage = document.getElementById('outputImage');
        outputImage.src = 'data:image/png;base64,' + imageSrc;

        Panzoom(outputImage, {
            maxZoom: 5,
            minZoom: 1,
            zoomSpeed: 0.1
        });
    }

    document.getElementById('uploadForm').addEventListener('submit', function (event) {
        event.preventDefault();

        var formData = new FormData();
        var fileInput = document.getElementById('fileInput');
        var band = document.getElementById('band').value;
        var colormap = document.getElementById('colormap').value;
        var hillshade = document.getElementById('hillshade').checked;

        formData.append('file', fileInput.files[0]);
        formData.append('band', band);
        formData.append('colormap', colormap);
        formData.append('hillshade', hillshade);

        fetch('/upload_hillshade', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.image) {
                showVisualization(data.image);
            } else {
                document.getElementById('message').textContent = data.error || 'An error occurred.';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('message').textContent = 'An error occurred.';
        });
    });

    showMap(); // Ensure map is shown initially
</script>

</body>
</html>

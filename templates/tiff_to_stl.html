<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raster to STL Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f8ff;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            color: #333;
        }
        input, button {
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .result {
            margin-top: 20px;
            background-color: #e7f3fe;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #b3d4fc;
        }
        .result h2 {
            color: #31708f;
        }
        .result p {
            color: #31708f;
        }
        .result a {
            color: #31708f;
            text-decoration: none;
            font-weight: bold;
        }
        .result a:hover {
            text-decoration: underline;
        }
        .progress-bar {
            display: none;
            margin-top: 20px;
            width: 100%;
            background-color: #f3f3f3;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar div {
            width: 0;
            height: 20px;
            background-color: #4CAF50;
            text-align: center;
            line-height: 20px;
            color: white;
        }
    </style>
    <script>
        function uploadFile(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const progressBar = document.getElementById('progress-bar');
            const progressBarFill = progressBar.querySelector('div');
            progressBar.style.display = 'block';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', form.action, true);

            xhr.upload.onprogress = function(event) {
                if (event.lengthComputable) {
                    const percentComplete = (event.loaded / event.total) * 100;
                    progressBarFill.style.width = percentComplete + '%';
                    progressBarFill.textContent = Math.round(percentComplete) + '%';
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    progressBarFill.style.width = '100%';
                    progressBarFill.textContent = '100%';
                    document.body.innerHTML = xhr.responseText;
                } else {
                    progressBarFill.style.backgroundColor = 'red';
                    progressBarFill.textContent = 'Upload failed';
                }
            };

            xhr.onerror = function() {
                progressBarFill.style.backgroundColor = 'red';
                progressBarFill.textContent = 'Upload failed';
            };

            xhr.send(formData);
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Raster to STL Converter</h1>
        <form action="{{ url_for('tiff_to_stl.convert_stl') }}" method="post" enctype="multipart/form-data" onsubmit="uploadFile(event)">
            <label for="file">Choose a .tiff file:</label>
            <input type="file" id="file" name="file" accept=".tif, .tiff" required>
            
            <label for="width">Width (mm):</label>
            <input type="number" id="width" name="width" step="0.01" required>
            
            <label for="vertical_exaggeration">Vertical Exaggeration:</label>
            <input type="number" id="vertical_exaggeration" name="vertical_exaggeration" step="0.01" required>
            
            <button type="submit">Upload</button>
        </form>
        <div id="progress-bar" class="progress-bar">
            <div>0%</div>
        </div>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        {% if mean_elevation is not none %}
            <div class="result">
                <h2>Results</h2>
                <p>Mean Elevation: {{ mean_elevation }}</p>
                <p>Lowest Elevation: {{ min_elevation }}</p>
                <p>Highest Elevation: {{ max_elevation }}</p>
                <a href="{{ stl_url }}" download>Download STL File</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
